name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the report job elevates to pull-requests: write.
permissions:
  contents: read

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff + mypy
        # Pin the format/lint gate for reproducibility. An unpinned `--upgrade`
        # tracks whatever ruff ships that day, so a new release can reformat or
        # add a rule and red an unrelated PR. 0.15.18 is the version this tree
        # was verified clean against. mypy is advisory (continue-on-error below),
        # pinned only to keep its output stable — bump freely.
        run: python -m pip install ruff==0.15.18 mypy==1.20.2
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (advisory)
        # Non-blocking to start: the codebase is only partially typed. Tighten
        # per-module over time, then drop continue-on-error.
        continue-on-error: true
        run: mypy browser_service

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test deps
        run: python -m pip install -e ".[test]"
      - name: Run tests with coverage
        # `-m "not integration"` skips the live-browser / live-internet suites
        # (test_integration/ + the chromium fixture tests). The remaining suite
        # is fully mocked; no browser needed.
        #
        # Coverage data is written to a plainly-named file, not the default
        # `.coverage`: upload-artifact v4 drops dotfiles unless
        # include-hidden-files is set, so a hidden data file would vanish
        # between here and the combine job without any error.
        env:
          COVERAGE_FILE: coverage-fast.dat
        run: >-
          pytest -m "not integration"
          --cov=browser_service
          --cov-report=term-missing
          --junitxml=junit.xml
          -q
      - name: Upload fast-lane coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: |
            coverage-fast.dat
            junit.xml
          if-no-files-found: warn

  fixture-tests:
    name: Fixture tests (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test deps
        run: python -m pip install -e ".[test]"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install chromium
        run: python -m playwright install --with-deps chromium
      - name: Run fixture tests (chromium + local HTML)
        # Deterministic locator tests driven against local/inline HTML — no
        # internet, no LLM. Catches locator regressions at PR time instead of
        # at the (rate-limited) downstream NL bench.
        #
        # These carry coverage now. They are the only lane that executes the
        # async locator paths in smart_locator.py against a real DOM; covering
        # those with mocked page objects would assert that a stub returns what
        # the stub was told to return, which inflates the number without
        # testing the locator logic. Real CI signal, so it counts.
        env:
          COVERAGE_FILE: coverage-fixture.dat
        run: pytest -m fixture --cov=browser_service --cov-report= -q
      - name: Upload fixture-lane coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fixture
          path: coverage-fixture.dat
          if-no-files-found: warn

  coverage:
    name: Combined coverage
    needs: [test, fixture-tests]
    runs-on: ubuntu-latest
    # SonarCloud needs full history for accurate blame/new-code detection.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test deps
        # The package itself, not just coverage: `coverage xml` resolves the
        # recorded filenames back to source, and Sonar needs the tree anyway.
        run: python -m pip install -e ".[test]"
      - name: Download fast-lane coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-fast
      - name: Download fixture-lane coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-fixture
      - name: Combine lanes
        # The two lanes overlap partially: the fast lane is fully mocked, the
        # fixture lane drives chromium. Union is the honest picture of what CI
        # actually executes. Both files are combined into one dataset here;
        # `combine` consumes its inputs, so the fast-lane number is measured
        # first, off a copy, and kept as a watch metric in the PR report.
        run: |
          set -euo pipefail
          cp coverage-fast.dat mocked-only.dat
          COVERAGE_FILE=mocked-only.dat coverage report --format=total --fail-under=0 > mocked-only.txt
          coverage combine coverage-fast.dat coverage-fixture.dat
          coverage xml
          coverage report --fail-under=0
          coverage report --format=total --fail-under=0 > combined.txt
          echo "mocked-only: $(cat mocked-only.txt)%  combined: $(cat combined.txt)%"
      - name: Coverage floor
        # 68, three points under today's 71. Catches a collapse — a lane that
        # silently stopped running, a large untested module landing — without
        # redding PRs for ordinary churn.
        #
        # Deliberately NOT `[tool.coverage.report] fail_under` in pyproject:
        # pytest-cov reads that same key, so the fast lane (65% alone, by
        # design — the fixture lane carries the locator paths) would fail its
        # own job, and `coverage report` exits 2 mid-script before combined.txt
        # is written. Verified both: pytest exits 1, coverage report exits 2.
        # The floor belongs to the combined dataset, so it is asserted here,
        # after every artifact above has been produced.
        run: coverage report --fail-under=68
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
            combined.txt
            mocked-only.txt
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        # Third-party actions are pinned to a commit SHA, not a mutable tag:
        # retagging upstream would otherwise run new code in a job that holds
        # our tokens. Bump the SHA and the trailing comment together.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # Codecov availability is not a code-quality signal. An upload blip
          # must not red the merge gate — the coverage artifact and the Sonar
          # scan below still carry the numbers.
          fail_ci_if_error: false
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0

  build:
    name: Build & package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel + sdist and validate metadata
        # Same hash-locked tooling and same --no-isolation build as the release
        # job in publish.yml. This job holds no id-token and no secrets, so it is
        # not a privilege-escalation surface — the point of sharing the lockfile
        # is that PR CI then actually exercises the release path, and a lockfile
        # bump that breaks the build reds a PR instead of a release.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build.txt
          python -m build --no-isolation
          python -m pip install twine==6.2.0
          python -m twine check dist/*

  report:
    name: PR report
    runs-on: ubuntu-latest
    needs: [quality, test, fixture-tests, coverage, build]
    if: always()
    permissions:
      contents: read
      pull-requests: write  # upserts the sticky PR comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
        continue-on-error: true
      - name: Download fast-lane results (fallback)
        # The coverage job needs test + fixture-tests, so a red test lane skips
        # it and test-reports is never produced — leaving the report showing
        # "? run · ? failed" in exactly the run someone needs to read. junit.xml
        # is uploaded by the test job itself under if: always(), so pull it
        # straight from there. Same file when both exist (same job, same run),
        # so the overwrite is a no-op rather than a conflict.
        uses: actions/download-artifact@v4
        with:
          name: coverage-fast
          path: reports
        continue-on-error: true
      - name: Compose report
        id: compose
        env:
          Q_RESULT: ${{ needs.quality.result }}
          T_RESULT: ${{ needs.test.result }}
          F_RESULT: ${{ needs.fixture-tests.result }}
          C_RESULT: ${{ needs.coverage.result }}
          B_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; cancelled) echo "🚫";; *) echo "❔";; esac; }

          # --- coverage: the gate number and the watch number ---
          # COMBINED is the union of the mocked fast lane and the chromium
          # fixture lane — what CI genuinely executes, and the number the gate
          # is set against. MOCKED is the fast lane alone, reported so that a
          # slide there stays visible instead of hiding under fixture-lane
          # gains: if MOCKED drifts down while COMBINED holds, pure-logic tests
          # are being traded for browser-driven ones.
          COV="n/a"; COV_MOCKED="n/a"
          [ -s reports/combined.txt ] && COV="$(cat reports/combined.txt)%"
          [ -s reports/mocked-only.txt ] && COV_MOCKED="$(cat reports/mocked-only.txt)%"
          if [ "$COV" = "n/a" ] && [ -f reports/coverage.xml ]; then
            RATE=$(grep -o 'line-rate="[0-9.]*"' reports/coverage.xml | head -1 | grep -o '[0-9.]*' || echo "")
            [ -n "$RATE" ] && COV="$(awk "BEGIN{printf \"%.1f%%\", ${RATE}*100}")"
          fi

          # --- test totals from junit.xml ---
          TESTS="?"; FAILS="?"; ERRORS="?"; SKIPPED="?"
          if [ -f reports/junit.xml ]; then
            LINE=$(grep -o '<testsuite [^>]*>' reports/junit.xml | head -1 || echo "")
            get() { echo "$LINE" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo "?"; }
            TESTS=$(get tests); FAILS=$(get failures); ERRORS=$(get errors); SKIPPED=$(get skipped)
          fi

          # --- commit details ---
          SUBJECT=$(git log -1 --format=%s "$HEAD_SHA" 2>/dev/null || echo "")
          AUTHOR=$(git log -1 --format='%an' "$HEAD_SHA" 2>/dev/null || echo "")

          # --- changed files ---
          if [ -n "${BASE_SHA:-}" ]; then
            FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          # `|| true`, not `|| echo 0`: grep -c prints its count AND exits 1 on
          # zero matches, so the fallback would append a second line and make
          # NCHANGED "0\n0" — which then errors the -gt test below.
          NCHANGED=$(printf '%s\n' "$FILES" | grep -c . || true)
          NCHANGED=${NCHANGED:-0}
          FILELIST=$(printf '%s\n' "$FILES" | grep . | head -20 | sed 's/^/- `/;s/$/`/' || echo "")
          [ "$NCHANGED" -gt 20 ] && FILELIST="${FILELIST}"$'\n'"- …and $((NCHANGED-20)) more"

          {
            echo "## 🧪 browser-service CI report"
            echo ""
            echo "**Commit:** \`$HEAD_SHA\`"
            echo "**Author:** $AUTHOR"
            echo "**Message:** $SUBJECT"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint & types | $(icon "$Q_RESULT") $Q_RESULT |"
            echo "| Tests & coverage | $(icon "$T_RESULT") $T_RESULT |"
            echo "| Fixture tests (chromium) | $(icon "$F_RESULT") $F_RESULT |"
            echo "| Combined coverage | $(icon "$C_RESULT") $C_RESULT |"
            echo "| Build & package | $(icon "$B_RESULT") $B_RESULT |"
            echo ""
            echo "**Tests:** ${TESTS} run · ${FAILS} failed · ${ERRORS} errored · ${SKIPPED} skipped"
            echo "**Coverage (gate, fast + fixture lanes):** ${COV}"
            echo "**Coverage (watch, mocked fast lane only):** ${COV_MOCKED}"
            echo ""
            echo "**Changed files (${NCHANGED}):**"
            echo ""
            echo "${FILELIST}"
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert sticky PR comment
        # Fork PRs get a read-only GITHUB_TOKEN under the pull_request trigger, so
        # createComment/updateComment would 403 and red this final gate. Restrict
        # to same-repo PRs, where the token can write; forks still get the run's
        # step summary.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bs-ci-report -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if any gate job did not succeed
        # Last step on purpose: the report and the sticky comment are published
        # first, so a red run still explains itself. Without this the report job
        # is green whenever its own steps are, which makes it look like an
        # aggregate check while gating nothing — pick it as the single required
        # check in branch protection and every red PR would merge. With it,
        # "PR report" is the one check worth requiring.
        if: >-
          needs.quality.result != 'success' ||
          needs.test.result != 'success' ||
          needs.fixture-tests.result != 'success' ||
          needs.coverage.result != 'success' ||
          needs.build.result != 'success'
        run: |
          echo "::error::One or more CI gate jobs did not succeed — see the summary table."
          exit 1
