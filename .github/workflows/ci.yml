name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # report job upserts a sticky PR comment

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff + mypy
        run: python -m pip install --upgrade ruff mypy
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (advisory)
        # Non-blocking to start: the codebase is only partially typed. Tighten
        # per-module over time, then drop continue-on-error.
        continue-on-error: true
        run: mypy browser_service

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    # SonarCloud needs full history for accurate blame/new-code detection.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test deps
        run: python -m pip install -e ".[test]"
      - name: Run tests with coverage
        # `-m "not integration"` skips the live-browser / live-internet suites
        # (test_integration/ + the chromium fixture tests) — the repo's own CI
        # convention. The remaining suite is fully mocked; no browser needed.
        run: >-
          pytest -m "not integration"
          --cov=browser_service
          --cov-report=xml
          --cov-report=term-missing
          --junitxml=junit.xml
          -q
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6

  build:
    name: Build & package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel + sdist and validate metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

  report:
    name: PR report
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
        continue-on-error: true
      - name: Compose report
        id: compose
        env:
          Q_RESULT: ${{ needs.quality.result }}
          T_RESULT: ${{ needs.test.result }}
          B_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; cancelled) echo "🚫";; *) echo "❔";; esac; }

          # --- coverage % from coverage.xml line-rate ---
          COV="n/a"
          if [ -f reports/coverage.xml ]; then
            RATE=$(grep -o 'line-rate="[0-9.]*"' reports/coverage.xml | head -1 | grep -o '[0-9.]*' || echo "")
            [ -n "$RATE" ] && COV="$(awk "BEGIN{printf \"%.1f%%\", ${RATE}*100}")"
          fi

          # --- test totals from junit.xml ---
          TESTS="?"; FAILS="?"; ERRORS="?"; SKIPPED="?"
          if [ -f reports/junit.xml ]; then
            LINE=$(grep -o '<testsuite [^>]*>' reports/junit.xml | head -1 || echo "")
            get() { echo "$LINE" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo "?"; }
            TESTS=$(get tests); FAILS=$(get failures); ERRORS=$(get errors); SKIPPED=$(get skipped)
          fi

          # --- commit details ---
          SUBJECT=$(git log -1 --format=%s "$HEAD_SHA" 2>/dev/null || echo "")
          AUTHOR=$(git log -1 --format='%an' "$HEAD_SHA" 2>/dev/null || echo "")

          # --- changed files ---
          if [ -n "${BASE_SHA:-}" ]; then
            FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          NCHANGED=$(printf '%s\n' "$FILES" | grep -c . || echo 0)
          FILELIST=$(printf '%s\n' "$FILES" | grep . | head -20 | sed 's/^/- `/;s/$/`/' || echo "")
          [ "$NCHANGED" -gt 20 ] && FILELIST="${FILELIST}"$'\n'"- …and $((NCHANGED-20)) more"

          {
            echo "## 🧪 browser-service CI report"
            echo ""
            echo "**Commit:** \`$HEAD_SHA\`"
            echo "**Author:** $AUTHOR"
            echo "**Message:** $SUBJECT"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint & types | $(icon "$Q_RESULT") $Q_RESULT |"
            echo "| Tests & coverage | $(icon "$T_RESULT") $T_RESULT |"
            echo "| Build & package | $(icon "$B_RESULT") $B_RESULT |"
            echo ""
            echo "**Tests:** ${TESTS} run · ${FAILS} failed · ${ERRORS} errored · ${SKIPPED} skipped"
            echo "**Coverage (non-integration):** ${COV}"
            echo ""
            echo "**Changed files (${NCHANGED}):**"
            echo ""
            echo "${FILELIST}"
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bs-ci-report -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
