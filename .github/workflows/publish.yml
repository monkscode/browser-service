name: Publish Python 🐍 distributions 📦 to PyPI

env:
  AUTO_BUMP_LEVEL: patch
  PYPI_PACKAGE_NAME: browser-service

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  extract-tag:  
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:  
      version: ${{ steps.extract_tag.outputs.tag }}  
    steps:  
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: extract_tag  
        name: Extract or generate version  
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(python3 .github/scripts/resolve_version.py)
            echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          fi  

  test:
    name: Gate on tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test deps
        run: python3 -m pip install -e ".[test]"
      - name: Run tests (excluding live integration)
        run: python3 -m pytest -m "not integration" -q

  build-and-publish-pypi:
    needs: [extract-tag, test]
    runs-on: ubuntu-latest
    environment: 
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python3 -m pip install --upgrade build twine
      - name: Update version in pyproject.toml
        run: sed -i 's/^version = "[^"]*"/version = "${{ needs.extract-tag.outputs.version }}"/' pyproject.toml
      - name: Build sdist + wheel
        run: python3 -m build
      - name: Check distribution metadata
        run: python3 -m twine check dist/*
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with: 
          attestations: false
