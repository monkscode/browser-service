name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  extract-tag:  
    runs-on: ubuntu-latest  
    outputs:  
      version: ${{ steps.extract_tag.outputs.tag }}  
    steps:  
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation
      
      - id: extract_tag  
        name: Extract or generate version  
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - use input version
            echo "::set-output name=tag::${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push - extract version from tag
            echo "::set-output name=tag::$(echo $GITHUB_REF | cut -d / -f 3)"
          else
            # Auto trigger on main branch - generate version
            # Get the latest tag, default to 0.0.0 if none exists
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            echo "Latest tag: $LATEST_TAG"
            
            # Extract version parts
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            
            # Increment patch version
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            
            echo "Generated version: $NEW_VERSION"
            echo "::set-output name=tag::$NEW_VERSION"
          fi  

  build-and-publish-pypi:
    needs: [extract-tag]
    runs-on: ubuntu-latest
    environment: 
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python3 -m pip install setuptools wheel twine
      - name: Update version in setup.py
        run: sed -i 's/version="[^"]*"/version="${{ needs.extract-tag.outputs.version }}"/' setup.py
      - name: Update version in pyproject.toml
        run: sed -i 's/version = "[^"]*"/version = "${{ needs.extract-tag.outputs.version }}"/' pyproject.toml
      - name: Update package name in setup.py  
        run: sed -i 's/name="[^"]*"/name="browser-service"/' setup.py
      - name: Update package name in pyproject.toml
        run: sed -i 's/name = "[^"]*"/name = "browser-service"/' pyproject.toml
      - name: Build a binary wheel
        run: python3 setup.py sdist bdist_wheel
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with: 
          attestations: false
