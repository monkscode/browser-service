name: Publish Python 🐍 distributions 📦 to PyPI

env:
  AUTO_BUMP_LEVEL: patch
  PYPI_PACKAGE_NAME: browser-service

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  extract-tag:  
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:  
      version: ${{ steps.extract_tag.outputs.tag }}  
    steps:  
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: extract_tag  
        name: Extract or generate version  
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(python3 .github/scripts/resolve_version.py)
            echo "tag=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          fi  

  build-and-publish-pypi:
    needs: [extract-tag]
    runs-on: ubuntu-latest
    environment: 
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python3 -m pip install setuptools wheel twine
      - name: Update version in setup.py
        run: sed -i 's/version="[^"]*"/version="${{ needs.extract-tag.outputs.version }}"/' setup.py
      - name: Update version in pyproject.toml
        run: sed -i 's/version = "[^"]*"/version = "${{ needs.extract-tag.outputs.version }}"/' pyproject.toml
      - name: Update package name in setup.py  
        run: sed -i 's/name="[^"]*"/name="browser-service"/' setup.py
      - name: Update package name in pyproject.toml
        run: sed -i 's/name = "[^"]*"/name = "browser-service"/' pyproject.toml
      - name: Build a binary wheel
        run: python3 setup.py sdist bdist_wheel
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with: 
          attestations: false
