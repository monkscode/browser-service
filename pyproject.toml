[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-service"
version = "1.0.0"
description = "Browser automation service with AI-powered element identification and locator generation"
readme = "README.md"
# Mirrors browser-use's own <4.0,>=3.11. The floor matters most: this file used
# to declare ">=3.10" alongside a browser-use requiring >=3.11, which made a 3.10
# install unsatisfiable. The <4.0 cap is carried for the same reason — claiming
# support for a Python the pinned dependency forbids is the same wrong metadata,
# and this package publishes to PyPI. Corrected with the 0.13.7 bump.
requires-python = ">=3.11,<4.0"
license = {text = "Apache-2.0"}
authors = [
    {name = "monkscode", email = "1dhruvilvyas@gmail.com"}
]
maintainers = [
    {name = "monkscode", email = "1dhruvilvyas@gmail.com"}, 
    {name = "Devasy23", email = "patel.devasy.23@gmail.com"}
]
keywords = ["browser", "automation", "testing", "locators", "selenium", "playwright", "robot-framework", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # browser-use exact-pins its own tree (openai, mcp, pydantic, google-genai,
    # aiohttp) — never co-install with crewai in one venv.
    "browser-use==0.13.7",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "flask>=3.0.0",
    "requests>=2.31.0",
    # Structured logging — REQUIRED: handlers/ and tasks/ import structlog
    # unconditionally, so the package fails to import without it.
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
# LLM tracing via OpenLLMetry — OPT-IN. __init__.py imports these lazily only
# when OBSERVABILITY_BACKEND != "none" and OTLP_ENDPOINT is set; absent, tracing
# is silently skipped. Keeps the default install lean.
observability = [
    "traceloop-sdk>=0.30.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/monkscode/browser-service"  # Update
Documentation = "https://github.com/monkscode/browser-service#readme"  # Update
Repository = "https://github.com/monkscode/browser-service"  # Update
"Bug Tracker" = "https://github.com/monkscode/browser-service/issues"  # Update

[tool.setuptools]
packages = ["browser_service"]

[tool.setuptools.package-data]
browser_service = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting (replaces isort).
# Whitespace/line-length rules are owned by `ruff format`, not enforced as lint
# errors: E501 (line length) and W291/W293, which otherwise flag trailing
# whitespace the formatter deliberately leaves inside multiline string literals
# (embedded JS / prompt templates in smart_locator.py).
select = ["E", "W", "F", "I"]
ignore = ["E501", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over lint purity: unused fixtures/imports/vars, redefinition.
"tests/**" = ["F401", "F811", "F841"]
# E402 (import-not-at-top) is intentional in these: __init__ must configure logging
# before imports; smart_locator re-exports handler symbols after a header comment;
# workflow imports after the module logger is set up.
"browser_service/__init__.py" = ["E402"]
"browser_service/locators/smart_locator.py" = ["E402"]
"browser_service/tasks/workflow.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
# Advisory to start — CI runs mypy non-blocking; tighten per-module over time.
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: umbrella marker for any test excluded from the default fast lane (-m 'not integration')",
    "fixture: integration test that drives chromium against local/inline HTML — deterministic, CI-safe",
    "live: integration test that needs live internet or a full browser-use session — not run in CI",
]

[tool.coverage.run]
source = ["browser_service"]
omit = ["*/__pycache__/*", "*/tests/*"]
