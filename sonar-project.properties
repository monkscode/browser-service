sonar.projectKey=monkscode_browser-service
sonar.organization=monkscode

sonar.projectName=browser-service
sonar.projectVersion=1.0

sonar.sources=browser_service
sonar.tests=tests
# Matches pyproject's declared support (requires-python = ">=3.10" plus the
# 3.10/3.11/3.12 classifiers), not just the version CI happens to run — the
# same floor ruff (target-version = py310) and mypy (python_version = 3.10)
# are configured against. The tree is 3.10-clean today (verified: mypy
# --python-version 3.10 reports no errors the 3.12 run does not); this keeps
# Sonar flagging it if 3.11+-only syntax lands later.
sonar.python.version=3.10, 3.11, 3.12

sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Test HTML fixtures are static data (embedded pages), not analyzable source;
# examples/ is illustrative snippets. Exclude both from analysis + duplication.
sonar.exclusions=**/__pycache__/**,tests/**/locator_fixtures/**,examples/**
sonar.test.exclusions=**/__pycache__/**
