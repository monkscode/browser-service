sonar.projectKey=monkscode_browser-service
sonar.organization=monkscode

sonar.projectName=browser-service
sonar.projectVersion=1.0

sonar.sources=browser_service
sonar.tests=tests
sonar.python.version=3.12

sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Test HTML fixtures are static data (embedded pages), not analyzable source;
# examples/ is illustrative snippets. Exclude both from analysis + duplication.
sonar.exclusions=**/__pycache__/**,tests/**/locator_fixtures/**,examples/**
sonar.test.exclusions=**/__pycache__/**
