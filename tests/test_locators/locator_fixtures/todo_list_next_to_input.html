<!doctype html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }
  .todoapp { width: 550px; margin: 0 auto; }
  h1 { margin: 0; height: 60px; font-size: 40px; }
  .new-todo { display: block; box-sizing: border-box; width: 100%; height: 65px;
              padding: 16px 16px 16px 60px; font-size: 24px; margin: 0; }
  .todo-list { list-style: none; margin: 0; padding: 0; }
  .todo-list li { position: relative; }
  .todo-list .toggle { position: absolute; left: 10px; top: 18px; }
  .todo-list label { display: block; padding: 15px 15px 15px 60px; line-height: 1.2; font-size: 24px; }
</style>
</head>
<body>
  <!-- todomvc u10 (2026-09-15 probe): after typing "buy milk" + Enter the input is
       empty again and the text lives in the list. The agent indexed the INPUT
       (element_index=5) for "the list item text"; the A2 form-control carve-out
       accepted [placeholder="What needs to be done?"] and Get Text returned "". -->
  <section class="todoapp">
    <header class="header">
      <h1>todos</h1>
      <input class="new-todo" placeholder="What needs to be done?" autofocus>
    </header>
    <section class="main">
      <ul class="todo-list">
        <li data-testid="todo-item">
          <div class="view">
            <input class="toggle" type="checkbox">
            <label data-testid="todo-title">buy milk</label>
            <button class="destroy"></button>
          </div>
        </li>
      </ul>
    </section>
  </section>
</body>
</html>
